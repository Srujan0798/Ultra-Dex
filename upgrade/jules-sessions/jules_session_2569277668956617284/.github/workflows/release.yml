name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: |
          cd cli
          npm ci --legacy-peer-deps

      - name: Run tests
        run: |
          cd cli
          npm test

      - name: Run lint
        run: |
          cd cli
          npm run lint || true

      - name: Validate CLI
        run: |
          cd cli
          node bin/ultra-dex.js --version
          node bin/ultra-dex.js --help

  publish-npm:
    name: Publish to npm
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          cd cli
          npm ci --legacy-peer-deps

      - name: Publish to npm
        run: |
          cd cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Extract changelog section for this version
          CHANGELOG=$(awk "/^## \[?${VERSION#v}/ {found=1; next} /^## \[?[0-9]/ {if(found) exit} found {print}" CHANGELOG.md || echo "Release $VERSION")

          # If no changelog found, create a basic one
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="## What's New in $VERSION

          See [CHANGELOG.md](CHANGELOG.md) for full details.

          ### Installation

          \`\`\`bash
          npm install -g ultra-dex@${VERSION#v}
          \`\`\`

          ### Quick Start

          \`\`\`bash
          npx ultra-dex init
          npx ultra-dex validate
          \`\`\`
          "
          fi

          # Save to file for multiline support
          echo "$CHANGELOG" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Ultra-Dex ${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Ultra-Dex Report for Release
        run: |
          cd cli
          npm install
          node bin/ultra-dex.js export --format json --output ../ultra-dex-release-report.json || true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ultra-dex-release-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()
