# Ultra-Dex CI/CD Pipeline Configuration
# Production-ready pipeline with security, testing, and deployment

name: Ultra-Dex CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Code Quality and Security Checks
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linters
      run: |
        npm run lint
        npm run format:check

    - name: Run security audit
      run: npm audit --audit-level moderate

    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test

    - name: Run coverage
      run: npm run test:coverage
      env:
        NODE_ENV: test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
        publishDeployment: github_actions
        config: >-
          p/secrets
          p/javascript
          p/owasp-top-ten

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Run unit tests
      run: npm run test:unit
      env:
        NODE_ENV: test

    - name: Run integration tests
      run: npm run test:integration
      env:
        NODE_ENV: test

    - name: Run performance tests
      run: npm run perf:benchmark
      env:
        NODE_ENV: test

  # Docker Build and Push
  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Docker image scan
      run: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # Deploy to Development
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
    - name: Deploy to Development
      run: |
        echo "Deploying to development environment..."
        # Add deployment commands here
        # Example: Deploy to development Kubernetes cluster
        # kubectl set image deployment/ultra-dex ultra-dex=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n ultra-dex-dev

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # Add deployment commands here
        # Example: Deploy to staging Kubernetes cluster
        # kubectl set image deployment/ultra-dex ultra-dex=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n ultra-dex-staging

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Add deployment commands here
        # Example: Deploy to production Kubernetes cluster
        # kubectl set image deployment/ultra-dex ultra-dex=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n ultra-dex-prod

  # Release
  release:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run release script
      run: npm run release:stable
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        draft: false
        prerelease: false

  # Notify
  notify:
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
    - name: Notify on Success
      if: ${{ needs.release.result == 'success' }}
      run: |
        echo "Pipeline completed successfully!"
        # Add notification commands here (Slack, Discord, etc.)

    - name: Notify on Failure
      if: ${{ contains(needs.*.result, 'failure') }}
      run: |
        echo "Pipeline failed!"
        # Add notification commands here (Slack, Discord, etc.)

# Environment Setup Instructions:
# 
# 1. Create GitHub Environments:
#    - development
#    - staging  
#    - production
#
# 2. Add Environment Variables:
#    - NPM_TOKEN (for publishing to npm)
#    - SEMGREP_APP_TOKEN (for security scanning)
#    - KUBECONFIG_PROD (for production deployment)
#    - KUBECONFIG_STAGING (for staging deployment)
#    - KUBECONFIG_DEV (for development deployment)
#
# 3. Add Repository Secrets:
#    - DOCKERHUB_USERNAME
#    - DOCKERHUB_TOKEN
#    - NPM_TOKEN
#    - SEMGREP_APP_TOKEN
#
# 4. Configure Branch Protection Rules:
#    - Require status checks to pass before merging
#    - Require branches to be up to date before merging
#    - Require review from Code Owners
#
# 5. Set up Notification Webhooks:
#    - Slack/Discord for deployment notifications
#    - Email for security alerts
#
# 6. Configure Dependabot for dependency updates:
#    - Update dependencies weekly
#    - Create PRs for security vulnerabilities