<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Dex Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container { max-width: 800px; width: 100%; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .subtitle { color: #888; margin-bottom: 40px; }
    .status-card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 600;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .status-ok { background: #22c55e; }
    .status-down { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .metric {
      text-align: center;
    }
    .metric-value {
      font-size: 2rem;
      font-weight: 700;
      color: #3b82f6;
    }
    .metric-label {
      color: #888;
      font-size: 0.9rem;
    }
    .endpoint-list {
      margin-top: 20px;
    }
    .endpoint {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      background: #252525;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .endpoint-name { font-weight: 500; }
    .endpoint-status { 
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .operational { background: #22c55e20; color: #22c55e; }
    .down { background: #ef444420; color: #ef4444; }
    footer {
      margin-top: 40px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ultra-Dex Status</h1>
    <p class="subtitle">Real-time system status and performance metrics</p>
    
    <div class="status-card">
      <div class="status-indicator">
        <span class="status-dot status-ok"></span>
        <span>All Systems Operational</span>
      </div>
      
      <div class="metrics">
        <div class="metric">
          <div class="metric-value" id="uptime">99.9%</div>
          <div class="metric-label">Uptime</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="latency">45ms</div>
          <div class="metric-label">Avg Latency</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="checks">1.2k</div>
          <div class="metric-label">Checks Today</div>
        </div>
      </div>
    </div>
    
    <div class="status-card">
      <h2>Service Endpoints</h2>
      <div class="endpoint-list">
        <div class="endpoint">
          <span class="endpoint-name">Health API</span>
          <span class="endpoint-status operational">Operational</span>
        </div>
        <div class="endpoint">
          <span class="endpoint-name">Authentication</span>
          <span class="endpoint-status operational">Operational</span>
        </div>
        <div class="endpoint">
          <span class="endpoint-name">Billing</span>
          <span class="endpoint-status operational">Operational</span>
        </div>
        <div class="endpoint">
          <span class="endpoint-name">AI Providers</span>
          <span class="endpoint-status operational">Operational</span>
        </div>
      </div>
    </div>
    
    <footer>
      Last updated: <span id="timestamp">Just now</span><br>
      Ultra-Dex © 2026
    </footer>
  </div>
  
  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('https://ultra-dex.onrender.com/api/status');
        const data = await res.json();
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
      } catch (e) {
        console.log('Status fetch failed');
      }
    }
    fetchStatus();
    setInterval(fetchStatus, 60000);
  </script>
</body>
</html>
