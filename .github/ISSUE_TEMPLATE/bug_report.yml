name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below with as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: A clear description of the bug
      placeholder: 'When I run X, Y happens instead of Z'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔄 Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Run `ultra-dex run planner -t "..."`
        2. Wait for response
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ✨ Expected Behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual Behavior
      description: What actually happens?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 📋 Logs/Errors
      description: Paste any relevant logs or error messages
      render: shell
  - type: input
    id: version
    attributes:
      label: 📦 Version
      description: Which version are you using?
      placeholder: '3.1.0'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: 🔢 Node.js Version
      placeholder: '20.0.0'
  - type: dropdown
    id: os
    attributes:
      label: 🖥️ Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
  - type: checkboxes
    id: terms
    attributes:
      label: ✅ Checklist
      options:
        - label: I've searched existing issues
        - label: I've checked the documentation
        - label: I've provided a minimal reproduction
        - label: This bug affects my workflow
