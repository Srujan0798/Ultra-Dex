name: Governance Compliance

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --omit=optional

      - name: Validate governance and policy files
        run: node gitFail/compliance/check-governance-files.js

      - name: Run GitHub policy guard (local mode)
        run: SKIP_REMOTE_CHECK=1 node gitFail/compliance/github-guard.js
