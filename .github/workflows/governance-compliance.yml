name: Governance Compliance

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --omit=optional

      - name: Check if governance scripts exist
        id: check
        run: |
          echo "compliance=$(test -f gitFail/compliance/check-governance-files.js && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "guard=$(test -f gitFail/compliance/github-guard.js && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Validate governance and policy files
        if: steps.check.outputs.compliance == 'true'
        run: node gitFail/compliance/check-governance-files.js

      - name: Run GitHub policy guard
        if: steps.check.outputs.guard == 'true'
        run: SKIP_REMOTE_CHECK=1 node gitFail/compliance/github-guard.js

      - name: Governance scripts not found
        if: steps.check.outputs.compliance == 'false'
        run: echo "Governance scripts not yet created - skipping"
