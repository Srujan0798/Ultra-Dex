name: CI Checks

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run type checking
        run: npm run typecheck || echo "Typecheck completed"

      - name: Run linting
        run: npm run lint || echo "Lint completed"

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level high || echo "Audit completed"

      - name: Check formatting
        run: npm run format:check || echo "Format check completed"
