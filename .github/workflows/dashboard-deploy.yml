name: Dashboard Deploy

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'

jobs:
  dashboard-verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if dashboard exists
        id: check
        run: echo "exists=$(test -d apps/dashboard && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Dashboard tests
        if: steps.check.outputs.exists == 'true'
        run: npm run test -w apps/dashboard

      - name: Dashboard accessibility smoke tests
        if: steps.check.outputs.exists == 'true'
        run: npm run test:a11y -w apps/dashboard

      - name: Dashboard build
        if: steps.check.outputs.exists == 'true'
        run: npm run build -w apps/dashboard
