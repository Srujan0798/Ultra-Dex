name: Dashboard Deploy

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'

jobs:
  dashboard-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove desktop app from workspaces
        run: |
          rm -rf apps/desktop
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.workspaces=['apps/cli','apps/cloud','apps/core-api','apps/dashboard','apps/docs-site','apps/github-integration','apps/mobile','apps/website','apps/white-label','packages/*']; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install --force --ignore-scripts --legacy-peer-deps

      - name: Dashboard tests
        run: cd apps/dashboard && npm run test
        continue-on-error: true

      - name: Dashboard accessibility smoke tests
        run: cd apps/dashboard && npm run test:a11y
        continue-on-error: true

      - name: Dashboard build
        run: cd apps/dashboard && npm run build
        continue-on-error: true

  dashboard-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dashboard-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove desktop app from workspaces
        run: |
          rm -rf apps/desktop
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.workspaces=['apps/cli','apps/cloud','apps/core-api','apps/dashboard','apps/docs-site','apps/github-integration','apps/mobile','apps/website','apps/white-label','packages/*']; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install --force --ignore-scripts --legacy-peer-deps

      - name: Build dashboard
        run: cd apps/dashboard && npm run build
        continue-on-error: true

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN"
