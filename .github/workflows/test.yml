name: Test Suite

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules
        run: npm rebuild sqlite3

      - name: Run core tests
        run: node --test tests/core/*.test.js

      - name: Run CLI tests
        run: node --test tests/cli/*.test.js

      - name: Run CLI git workflow tests
        run: node --test --test-timeout=10000 apps/cli/test/git-workflow.test.js

      - name: Governance compliance check
        run: node gitFail/compliance/check-governance-files.js
