name: Test Ultra-Dex CLI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install --force --ignore-scripts

      - name: Install CLI dependencies
        run: cd apps/cli && npm install --force --ignore-scripts

      - name: Test CLI help
        run: cd apps/cli && timeout 30s node bin/ultra-dex.js --help || echo "CLI help check done"
        continue-on-error: true

      - name: Test NVIDIA provider
        run: |
          cd apps/cli && timeout 30s node -e "
            import('./lib/providers/nvidia.js').then(m => {
              const p = new m.NVIDIAProvider();
              console.log('NVIDIA provider loads');
            }).catch(e => console.error('NVIDIA provider failed:', e.message))
          " || echo "NVIDIA test done"
        continue-on-error: true
