name: Ultra-Dex Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force --legacy-peer-deps

      - name: Run security check
        run: |
          if [ -d ".github/actions/ultra-dex" ]; then
            echo "Running Ultra-Dex security agents..."
          else
            echo "Security agents not available - running npm audit instead"
            npm audit --audit-level high || true
          fi
