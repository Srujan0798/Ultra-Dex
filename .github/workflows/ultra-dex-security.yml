name: Ultra-Dex Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --omit=optional

      - name: Run npm security audit
        run: npm audit --audit-level moderate || echo "Audit completed with warnings"
        continue-on-error: true

      - name: Check if ultra-dex action exists
        id: check-action
        run: echo "exists=$(test -f .github/actions/ultra-dex/action.yml && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Run Ultra-Dex security agents
        if: steps.check-action.outputs.exists == 'true'
        uses: ./.github/actions/ultra-dex
        with:
          agents: 'security-audit'
          github-token: ${{ secrets.GITHUB_TOKEN }}
