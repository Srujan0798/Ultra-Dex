name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove desktop app
        run: |
          rm -rf apps/desktop
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.workspaces=['apps/cli','apps/cloud','apps/core-api','apps/dashboard','apps/docs-site','apps/github-integration','apps/mobile','apps/website','apps/white-label','packages/*']; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: ./scripts/deploy.sh
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_REPO: srujan0798/ultra-dex
        continue-on-error: true

      - name: Deploy Status
        if: always()
        run: echo "Deploy completed"
