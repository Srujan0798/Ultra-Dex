name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if deploy script exists
        id: check
        run: echo "exists=$(test -f scripts/deploy.sh && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Login to Container Registry
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        if: steps.check.outputs.exists == 'true'
        run: ./scripts/deploy.sh
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_REPO: ${{ github.repository }}

      - name: Deploy script not found
        if: steps.check.outputs.exists == 'false'
        run: echo "No deploy script found - skipping deployment"
