name: Vercel Log Capture

on:
  workflow_run:
    workflows: ['Deploy Ultra-Dex Website', 'Dashboard Deploy']
    types:
      - completed
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Vercel deployment URL to fetch logs from'
        required: false
        default: ''

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  capture-logs:
    runs-on: ubuntu-latest
    if: ${{ env.VERCEL_TOKEN != '' }}
    steps:
      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Get latest deployment
        id: get-deployment
        run: |
          # List deployments and get the latest one
          DEPLOYMENT=$(vercel list --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --json | jq -r '.[0]')
          DEPLOYMENT_ID=$(echo "$DEPLOYMENT" | jq -r '.uid')
          DEPLOYMENT_URL=$(echo "$DEPLOYMENT" | jq -r '.url')

          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Found deployment: $DEPLOYMENT_URL (ID: $DEPLOYMENT_ID)"

      - name: Capture build logs
        id: build-logs
        run: |
          echo "=== VERCEL BUILD LOGS ===" > logs.txt
          vercel logs ${{ steps.get-deployment.outputs.deployment_id }} \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --since="1h" \
            --output="raw" >> logs.txt 2>&1 || echo "No build logs available"

          echo "logs<<EOF" >> $GITHUB_OUTPUT
          cat logs.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-logs-${{ github.run_id }}
          path: logs.txt
          retention-days: 30

      - name: Comment logs on PR (if triggered by PR)
        if: github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logs = fs.readFileSync('logs.txt', 'utf8');
            const summary = logs.split('\n').slice(0, 50).join('\n'); // First 50 lines

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Vercel Deployment Logs\n\n**Deployment:** ${{ steps.get-deployment.outputs.deployment_url }}\n\n<details>\n<summary>View Logs (first 50 lines)</summary>\n\n\`\`\`\n${summary}\n\`\`\`\n\n</details>\n\n[Download full logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });

      - name: Output logs to console
        run: |
          echo "=========================================="
          echo "VERCEL DEPLOYMENT LOGS"
          echo "=========================================="
          cat logs.txt | tail -100
          echo "=========================================="
          echo "Full logs saved as artifact: vercel-logs-${{ github.run_id }}"
