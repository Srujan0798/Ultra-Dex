name: Vercel Log Capture

on:
  workflow_run:
    workflows: ['Deploy Ultra-Dex Website', 'Dashboard Deploy']
    types:
      - completed
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Vercel deployment URL to fetch logs from'
        required: false
        default: ''

jobs:
  capture-logs:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets exist
        id: check-secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ VERCEL_TOKEN not set, skipping log capture"
          fi

      - name: Setup Node.js
        if: steps.check-secrets.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.has_token == 'true'
        run: npm i -g vercel@latest

      - name: Get latest deployment
        if: steps.check-secrets.outputs.has_token == 'true'
        id: get-deployment
        run: |
          # List deployments and get the latest one
          DEPLOYMENT=$(vercel list --token="${{ secrets.VERCEL_TOKEN }}" --json 2>/dev/null | jq -r '.[0] // empty')
          if [ -z "$DEPLOYMENT" ]; then
            echo "No deployments found"
            exit 0
          fi
          DEPLOYMENT_ID=$(echo "$DEPLOYMENT" | jq -r '.uid')
          DEPLOYMENT_URL=$(echo "$DEPLOYMENT" | jq -r '.url')

          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Found deployment: $DEPLOYMENT_URL (ID: $DEPLOYMENT_ID)"

      - name: Capture build logs
        if: steps.check-secrets.outputs.has_token == 'true' && steps.get-deployment.outputs.deployment_id != ''
        id: build-logs
        run: |
          echo "=== VERCEL BUILD LOGS ===" > logs.txt
          vercel logs "${{ steps.get-deployment.outputs.deployment_id }}" \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --limit=100 \
            --no-follow 2>&1 | tee -a logs.txt || echo "No build logs available"

          echo "log_file=logs.txt" >> $GITHUB_OUTPUT

      - name: Upload logs as artifact
        if: steps.check-secrets.outputs.has_token == 'true' && steps.get-deployment.outputs.deployment_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: vercel-logs-${{ github.run_id }}
          path: logs.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Output logs to console
        if: steps.check-secrets.outputs.has_token == 'true' && steps.get-deployment.outputs.deployment_id != ''
        run: |
          echo "=========================================="
          echo "VERCEL DEPLOYMENT LOGS"
          echo "=========================================="
          if [ -f logs.txt ]; then
            tail -100 logs.txt
          else
            echo "No logs file found"
          fi
          echo "=========================================="
