name: Preview Environments

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if apps exist
        id: check
        run: echo "website=$(test -d apps/website && echo true || echo false)" >> $GITHUB_OUTPUT && echo "dashboard=$(test -d apps/dashboard && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Setup Node
        if: steps.check.outputs.website == 'true' || steps.check.outputs.dashboard == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.website == 'true' || steps.check.outputs.dashboard == 'true'
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Build website preview
        if: steps.check.outputs.website == 'true'
        run: npm run build -w apps/website

      - name: Build dashboard preview
        if: steps.check.outputs.dashboard == 'true'
        run: npm run build -w apps/dashboard

      - name: Comment preview placeholder
        if: steps.check.outputs.website == 'true' || steps.check.outputs.dashboard == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request?.number;
            if (!pr) return;
            const body = [
              '## Preview Build Ready',
              '',
              `PR #${pr} preview build completed successfully.`,
              '',
              'Configure VERCEL_TOKEN/ORG/PROJECT secrets to enable automatic URL deployment comments.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup note
        run: echo "PR closed. Preview cleanup hook can be wired to provider APIs."
