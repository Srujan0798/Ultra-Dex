name: Publish Package

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false --legacy-peer-deps

      - name: Run tests
        run: npm run test:ci

      - name: Governance compliance check
        run: node gitFail/compliance/check-governance-files.js

      - name: Build package
        run: npm run build

      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance || echo "Publish skipped (token requires automation or OTP setup)."

      - name: Skip npm publish (missing token)
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "Skipping npm publish - NPM_TOKEN is not configured."

      - name: Install VS Code extension dependencies
        working-directory: packages/extensions/vscode
        run: npm install --legacy-peer-deps

      - name: Package VS Code Extension
        working-directory: packages/extensions/vscode
        run: npx vsce package --no-dependencies

      - name: Upload VSIX to release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/extensions/vscode/*.vsix
