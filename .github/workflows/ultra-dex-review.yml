name: Ultra-Dex Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ultra_dex_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --omit=optional

      - name: Check if ultra-dex action exists
        id: check-action
        run: echo "exists=$(test -f .github/actions/ultra-dex/action.yml && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Run Ultra-Dex code review
        if: steps.check-action.outputs.exists == 'true'
        uses: ./.github/actions/ultra-dex
        with:
          agents: 'code-reviewer,security-audit'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-approve: 'false'

      - name: Review note
        if: steps.check-action.outputs.exists == 'false'
        run: echo "Ultra-Dex action not yet set up - skipping AI review"
