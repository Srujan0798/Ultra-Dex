name: Ultra-Dex Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clear platform-specific lock
        run: rm -f package-lock.json apps/*/package-lock.json packages/*/package-lock.json || true

      - name: Install root dependencies
        run: npm install --ignore-scripts --no-audit --fund=false --legacy-peer-deps

      - name: Rebuild native modules (sqlite3)
        run: npm rebuild sqlite3 || true
      - name: Verify fast-path CLI commands
        run: |
          set -euo pipefail
          timeout 45s ./apps/cli/bin/ultra-dex.js --help
          timeout 45s ./apps/cli/bin/ultra-dex.js run planner --help
          timeout 45s ./apps/cli/bin/ultra-dex.js quality --help
          timeout 45s ./apps/cli/bin/ultra-dex.js mcp-remote --help
          timeout 45s ./apps/cli/bin/ultra-dex.js env --help
      - name: Verify full-entrypoint CLI commands
        run: |
          set -euo pipefail
          timeout 45s ./apps/cli/bin/ultra-dex.js status --help
          timeout 45s ./apps/cli/bin/ultra-dex.js security --help
          timeout 45s ./apps/cli/bin/ultra-dex.js architect --help
