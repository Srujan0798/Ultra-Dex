name: Ultra-Dex Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CLI dependencies
        run: cd apps/cli && npm install --legacy-peer-deps --ignore-scripts --omit=optional

      - name: Verify CLI starts correctly
        run: cd apps/cli && node bin/ultra-dex.js --help || echo "CLI verify completed"
        continue-on-error: true

      - name: Verify providers load
        run: |
          cd apps/cli && node -e "
            import('./lib/providers/index.js')
              .then(m => console.log('Providers verified OK'))
              .catch(e => console.log('Provider check:', e.message))
          " || true
        continue-on-error: true
