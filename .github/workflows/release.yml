name: Build and Publish Ultra-Dex

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install CLI dependencies
        run: |
          cd apps/cli
          npm install --force --ignore-scripts --omit=optional
        continue-on-error: false

      - name: Install esbuild
        run: npm install --force esbuild

      - name: Create dist directory
        run: mkdir -p apps/cli/dist

      - name: Bundle into one file
        run: |
          npx esbuild apps/cli/bin/ultra-dex.js \
            --bundle \
            --platform=node \
            --outfile=apps/cli/dist/ultra-dex.js \
            --format=esm \
            --external:node-pty \
            --external:puppeteer \
            --external:sharp \
            --external:keytar \
            --external:sqlite3 \
            --external:playwright \
            --external:libsodium-wrappers \
            --external:ink \
            --external:ink-spinner \
            --external:@modelcontextprotocol/sdk \
            --external:neo4j-driver

      - name: Verify bundle exists
        run: |
          if [ ! -f apps/cli/dist/ultra-dex.js ]; then
            echo "ERROR: Bundle not created!"
            exit 1
          fi
          ls -lh apps/cli/dist/ultra-dex.js
          echo "SUCCESS: Bundle created"

      - name: Publish CLI to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd apps/cli
          echo "Publishing version: $(node -p "require('./package.json').version")"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ultra-Dex ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
