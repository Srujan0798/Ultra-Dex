name: Build and Publish Ultra-Dex

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install all dependencies
        run: cd apps/cli && npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Bundle into one file
        run: |
          npx esbuild apps/cli/bin/ultra-dex.js \
            --bundle \
            --platform=node \
            --outfile=dist/ultra-dex.js

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
