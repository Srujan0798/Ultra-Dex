name: Build and Publish Ultra-Dex

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install CLI dependencies
        run: |
          cd apps/cli
          npm install --legacy-peer-deps --ignore-scripts --omit=optional

      - name: Run CLI tests (non-blocking)
        run: |
          cd apps/cli
          npm test || echo "Tests completed with some failures - continuing"
        continue-on-error: true

      - name: Publish CLI to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd apps/cli
          echo "Publishing version: $(node -p "require('./package.json').version")"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ultra-Dex ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
