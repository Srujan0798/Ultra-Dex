name: Build and Publish Ultra-Dex

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install CLI dependencies
        run: cd apps/cli && npm install --legacy-peer-deps

      - name: Run CLI tests
        run: cd apps/cli && npm test || true

      - name: Create dist directory
        run: mkdir -p dist

      - name: Bundle into one file
        run: |
          npx esbuild apps/cli/bin/ultra-dex.js \
            --bundle \
            --platform=node \
            --outfile=dist/ultra-dex.js \
            --format=esm \
            --external:node-pty \
            --external:puppeteer \
            --external:sharp \
            --external:keytar \
            --external:sqlite3

      - name: Copy bundled file to CLI package
        run: cp dist/ultra-dex.js apps/cli/dist/ultra-dex.js

      - name: Publish CLI to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd apps/cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: Ultra-Dex ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
