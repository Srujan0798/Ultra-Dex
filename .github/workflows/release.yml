name: Build and Publish Ultra-Dex

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Clear platform-specific lock
        run: rm -f package-lock.json apps/*/package-lock.json packages/*/package-lock.json || true

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --fund=false --legacy-peer-deps

      - name: Create dist directory
        run: mkdir -p apps/cli/dist

      - name: Bundle CLI
        run: sh scripts/build-cli.sh || true

      - name: Verify bundle exists
        run: |
          if [ ! -f dist/ultra-dex.js ]; then
            echo "WARN: Bundle not at dist/ultra-dex.js — checking apps/cli/dist/"
            if [ ! -f apps/cli/dist/ultra-dex.js ]; then
              echo "WARN: No bundle found — CLI runs via tsx in this build"
            else
              ls -lh apps/cli/dist/ultra-dex.js
            fi
          else
            ls -lh dist/ultra-dex.js
            echo "SUCCESS: Bundle created"
          fi

      - name: Publish CLI to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.NODE_AUTH_TOKEN != ''
        run: |
          cd apps/cli
          echo "Publishing version: $(node -p "require('./package.json').version")"
          npm publish --access public || echo "Publish skipped (token requires automation or OTP setup)."

      - name: Skip npm publish (missing token)
        if: startsWith(github.ref, 'refs/tags/v') && env.NODE_AUTH_TOKEN == ''
        run: echo "Skipping npm publish - NPM_TOKEN is not configured."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ultra-Dex ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
