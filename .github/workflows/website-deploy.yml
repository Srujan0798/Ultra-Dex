name: Deploy Ultra-Dex Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clear platform-specific lock
        run: rm -f package-lock.json apps/*/package-lock.json packages/*/package-lock.json || true

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --fund=false --legacy-peer-deps

      - name: Build website
        run: |
          cd apps/website
          NEXT_DISABLE_ESLINT=1 npm run build

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          npx vercel@latest --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Skip Vercel deploy (missing secrets)
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: |
          echo "Skipping deploy: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not configured."
