name: Deploy Ultra-Dex Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if website exists
        id: check
        run: echo "exists=$(test -d apps/website && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          cd apps/website
          npm ci --legacy-peer-deps

      - name: Build website
        if: steps.check.outputs.exists == 'true'
        run: |
          cd apps/website
          npm run build

      - name: Deploy to Vercel
        if: steps.check.outputs.exists == 'true' && env.VERCEL_TOKEN != ''
        run: |
          npm install -g vercel
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
