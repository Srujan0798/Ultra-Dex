name: Ultra-Dex Review

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ultra-Dex Review
        uses: ./.github/actions/ultra-dex
        with:
          api-key: ${{ secrets.ULTRA_DEX_API_KEY }}
          agents: 'code-reviewer,security-audit'
        env:
          ULTRA_DEX_API_KEY: ${{ secrets.ULTRA_DEX_API_KEY }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

  deploy:
    needs: [review, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: echo "Deploying to production..."
