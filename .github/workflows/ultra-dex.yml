name: Ultra-Dex Review

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      ULTRA_DEX_API_KEY: ${{ secrets.ULTRA_DEX_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ultra-Dex Review
        if: ${{ env.ULTRA_DEX_API_KEY != '' }}
        uses: ./.github/actions/ultra-dex
        with:
          api-key: ${{ env.ULTRA_DEX_API_KEY }}
          agents: 'code-reviewer,security-audit'
        env:
          ULTRA_DEX_API_KEY: ${{ env.ULTRA_DEX_API_KEY }}

      - name: Skip Ultra-Dex Review (missing secret)
        if: ${{ env.ULTRA_DEX_API_KEY == '' }}
        run: |
          echo "Skipping Ultra-Dex review: ULTRA_DEX_API_KEY is not configured."

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false --legacy-peer-deps

      - name: Run smoke tests
        run: npm run test:push:smoke

  deploy:
    needs: [review, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: echo "Deploying to production..."
