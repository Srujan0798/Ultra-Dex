name: Ultra-Dex CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ultra-dex-validation:
    name: Ultra-Dex Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install Ultra-Dex globally
        run: |
          cd cli
          npm install
          npm link

      - name: Run Ultra-Dex Align
        run: |
          npx ultra-dex align --dir . || true
        continue-on-error: true

      - name: Run Ultra-Dex Validate
        id: validate
        run: |
          npx ultra-dex validate --dir . --scan
        continue-on-error: true

      - name: Generate Ultra-Dex Report
        run: |
          npx ultra-dex export --format json --output ultra-dex-report.json || true
        continue-on-error: true

      - name: Upload Ultra-Dex Report
        uses: actions/upload-artifact@v4
        with:
          name: ultra-dex-report
          path: ultra-dex-report.json
          retention-days: 30
        if: always()

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = { score: 'N/A', issues: [] };
            try {
              report = JSON.parse(fs.readFileSync('ultra-dex-report.json', 'utf8'));
            } catch (e) {
              console.log('No report file found');
            }
            
            const score = report.alignment?.score || report.score || 'N/A';
            const issues = report.validation?.issues?.length || report.issues?.length || 0;
            
            const body = `## 🎯 Ultra-Dex Validation Report
            
            | Metric | Value |
            |--------|-------|
            | Alignment Score | ${score}% |
            | Validation Issues | ${issues} |
            
            > Generated by Ultra-Dex v3.0 CI/CD Integration
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  cli-test:
    name: CLI Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: |
          cd cli
          npm ci

      - name: Run CLI Tests
        run: |
          cd cli
          npm test

      - name: Test CLI Commands
        run: |
          cd cli
          node bin/ultra-dex.js --version
          node bin/ultra-dex.js --help
          echo "✅ CLI commands work"
