name: Ultra-Dex AI Development Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  ai-development:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for AI action
        id: check-action
        run: |
          if [ -d ".github/actions/ultra-dex" ] && [ -f ".github/actions/ultra-dex/action.yml" ]; then
            echo "action_exists=true" >> $GITHUB_OUTPUT
          else
            echo "action_exists=false" >> $GITHUB_OUTPUT
            echo "Ultra-Dex custom action not found - skipping AI review"
          fi

      - name: Ultra-Dex AI Code Review
        if: ${{ env.OPENAI_API_KEY != '' && steps.check-action.outputs.action_exists == 'true' }}
        uses: ./.github/actions/ultra-dex
        with:
          agents: 'code-reviewer,security-audit'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
        continue-on-error: true

      - name: Skip AI Code Review
        if: ${{ env.OPENAI_API_KEY == '' || steps.check-action.outputs.action_exists != 'true' }}
        run: |
          if [ "${{ env.OPENAI_API_KEY }}" = "" ]; then
            echo "Skipping AI code review: OPENAI_API_KEY is not configured."
          else
            echo "Skipping AI code review: Custom action not available."
          fi

      # - name: Ultra-Dex Implementation
