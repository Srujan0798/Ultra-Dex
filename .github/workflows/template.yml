name: Ultra-Dex AI Development Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  ai-development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if ultra-dex action exists
        id: check
        run: echo "exists=$(test -d .github/actions/ultra-dex && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Ultra-Dex AI Code Review
        if: steps.check.outputs.exists == 'true'
        uses: ./.github/actions/ultra-dex
        with:
          agents: 'code-reviewer,security-audit'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  ai-deployment:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to production..."
