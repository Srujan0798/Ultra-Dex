      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # - name: Ultra-Dex Testing
      #   uses: ./.github/actions/ultra-dex
      #   with:
      #     task: 'Write comprehensive tests for the changes in this pull request'
      #     provider: 'openai'
      #     model: 'gpt-4o'
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # - name: Ultra-Dex Documentation
      #   uses: ./.github/actions/ultra-dex
      #   with:
      #     task: 'Generate or update documentation for the changes in this pull request'
      #     provider: 'openai'
      #     model: 'gpt-4o'
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  ai-deployment:
    needs: ai-development
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
