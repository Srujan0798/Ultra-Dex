name: 'Ultra-Dex AI Action'
description: 'Automate development tasks with Ultra-Dex AI agents'
inputs:
  task:
    description: 'The task description for the AI agents'
    required: true
  provider:
    description: 'AI Provider (openai, anthropic, google)'
    required: false
    default: 'openai'
  model:
    description: 'AI Model ID'
    required: false
    default: 'gpt-4o'
  agents:
    description: 'Comma-separated list of agents to activate'
    required: false
    default: 'code-reviewer'
  config-path:
    description: 'Path to configuration file'
    required: false
    default: '.ultra-dex.json'
  auto-approve:
    description: 'Automatically approve AI changes'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub Token for PR operations'
    required: true
  api-key:
    description: 'AI Provider API Key'
    required: false
runs:
  using: 'node20'
  main: 'index.js'
