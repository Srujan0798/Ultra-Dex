name: 'Ultra-Dex AI Review'
description: 'Automated code review with AI agents'
inputs:
  api-key:
    description: 'Ultra-Dex API key'
    required: true
  agents:
    description: 'Which agents to run (comma-separated)'
    required: false
    default: 'code-reviewer,security-checker'
  config-path:
    description: 'Path to Ultra-Dex config file'
    required: false
    default: '.ultra-dex.yml'
  auto-deploy:
    description: 'Whether to auto-deploy on main merge'
    required: false
    default: 'false'
  environment:
    description: 'Deployment environment (staging/production)'
    required: false
    default: 'staging'
outputs:
  result:
    description: 'Result of the AI review'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'zap'
  color: 'blue'