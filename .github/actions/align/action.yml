name: 'Ultra-Dex Alignment Check'
description: 'Check plan vs code alignment'
branding:
  icon: 'git-pull-request'
  color: 'green'

inputs:
  min-score:
    description: 'Minimum alignment score percentage'
    required: false
    default: '75'
  comment-on-pr:
    description: 'Post results as PR comment'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for PR comments'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Check Alignment
      shell: bash
      run: |
        echo "📊 Ultra-Dex Alignment Check"
        echo "Minimum score: ${{ inputs.min-score }}%"

        # Run alignment check
        OUTPUT=$(npx ultra-dex align --json 2>/dev/null || echo '{"score":0,"error":"align command failed"}')

        SCORE=$(echo "$OUTPUT" | npx jq -r '.score // 0')
        METRICS=$(echo "$OUTPUT" | npx jq -r '.metrics // {}')

        echo ""
        echo "📈 Alignment Score: $SCORE%"
        echo "📋 Metrics: $METRICS"

        # Determine status
        if [ "$SCORE" -ge "${{ inputs.min-score }}" ]; then
          STATUS="✅ PASS"
          COLOR="green"
          EXIT_CODE=0
        else
          STATUS="❌ FAIL"
          COLOR="red"
          EXIT_CODE=1
        fi

        echo ""
        echo "$STATUS - Alignment score: $SCORE% (min: ${{ inputs.min-score }}%)"

        # Comment on PR if enabled
        if [ "${{ inputs.comment-on-pr }}" = "true" ] && [ -n "$GITHUB_EVENT_PATH" ]; then
          PR_NUMBER=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
          
          if [ -n "$PR_NUMBER" ]; then
            COMMENT=$(cat <<EOF
        ## Ultra-Dex Alignment Report

        **Score:** $SCORE% / ${{ inputs.min-score }}% $STATUS

        **Metrics:**
        \`\`\`json
        $METRICS
        \`\`\`

        ---
        *Generated by Ultra-Dex Alignment Check Action*
        EOF
        )
            
            curl -s -X POST \
              -H "Authorization: token ${{ inputs.github-token }}" \
              -H "Content-Type: application/json" \
              -d "{\"body\": \"$COMMENT\"}" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" > /dev/null
            
            echo "💬 Posted comment to PR #$PR_NUMBER"
          fi
        fi

        exit $EXIT_CODE
