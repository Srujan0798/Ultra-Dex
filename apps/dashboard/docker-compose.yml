services:
  dashboard:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      - redis
      - postgres
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ULTRA_DEX_HOME=/data
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://ultradex:ultradex_dev@postgres:5432/ultradex
    volumes:
      - dashboard-data:/data
    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    ports:
      - '6379:6379'
      - '8001:8001'
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ultradex
      POSTGRES_USER: ultradex
      POSTGRES_PASSWORD: ultradex_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dashboard-data:
  redis-data:
  postgres-data:
