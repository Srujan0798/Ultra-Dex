<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultra-Dex Desktop</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui;
        background: #0f172a;
        color: #e2e8f0;
        display: grid;
        place-items: center;
        height: 100vh;
      }
      .card {
        padding: 32px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid #1e293b;
        text-align: center;
      }
      .card h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      .card p {
        margin: 0;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ultra-Dex Desktop</h1>
      <p>Start the dashboard server, then relaunch to connect.</p>
    </div>
  </body>
</html>
