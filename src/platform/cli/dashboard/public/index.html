<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultra-Dex Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <h1>Ultra-Dex Dashboard</h1>
      <div>
        <button id="toggleTheme" class="toggle">Toggle Theme</button>
        <button id="exportReport">Export Report</button>
      </div>
    </header>

    <div class="container">
      <div class="grid">
        <div class="card">
          <h3>Alignment Score</h3>
          <canvas id="alignmentChart" height="140"></canvas>
        </div>
        <div class="card">
          <h3>System Status</h3>
          <p>Active Agents: 4</p>
          <p>Context Usage: 62%</p>
          <p>Last Sync: Just now</p>
        </div>
        <div class="card">
          <h3>Recent Actions</h3>
          <ul class="timeline" id="timeline">
            <li>Generated plan for payments module</li>
            <li>Swarm executed backend tasks</li>
            <li>Review completed with 2 warnings</li>
          </ul>
        </div>
      </div>
    </div>

    <script>
      const ctx = document.getElementById('alignmentChart');
      const alignmentChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['10:00', '10:15', '10:30', '10:45', '11:00'],
          datasets: [
            {
              label: 'Alignment Score',
              data: [72, 78, 81, 85, 88],
              borderColor: '#6366f1',
              backgroundColor: 'rgba(99,102,241,0.2)',
              tension: 0.3,
            },
          ],
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { min: 0, max: 100 } },
        },
      });

      function pushAlignmentPoint() {
        const now = new Date();
        const label = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        alignmentChart.data.labels.push(label);
        const lastValue = alignmentChart.data.datasets[0].data.slice(-1)[0] ?? 80;
        const next = Math.max(30, Math.min(100, lastValue + (Math.random() * 6 - 3)));
        alignmentChart.data.datasets[0].data.push(Math.round(next));
        if (alignmentChart.data.labels.length > 8) {
          alignmentChart.data.labels.shift();
          alignmentChart.data.datasets[0].data.shift();
        }
        alignmentChart.update();
      }

      setInterval(pushAlignmentPoint, 5000);

      document.getElementById('toggleTheme').addEventListener('click', () => {
        document.body.classList.toggle('light');
      });

      document.getElementById('exportReport').addEventListener('click', () => {
        const report = {
          alignment: alignmentChart.data.datasets[0].data,
          timestamp: new Date().toISOString(),
        };
        const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ultra-dex-report.json';
        a.click();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
