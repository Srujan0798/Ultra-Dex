apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultra-dex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ultra-dex
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ultra-dex
    spec:
      containers:
        - name: ultra-dex
          image: ultra-dex:latest
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ultra-dex-secrets
                  key: anthropic
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 15
