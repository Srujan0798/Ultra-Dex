stages:
  - validate
  - test
  - build
  - deploy

cache:
  paths:
    - .ultra/

validate:
  stage: validate
  script:
    - npm ci
    - npx ultra-dex doctor
    - npx ultra-dex validate

test:
  stage: test
  script:
    - npm ci
    - npm test
    - npx ultra-dex verify

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - CONTEXT.md
      - .ultra/

deploy:
  stage: deploy
  script:
    - |
      if [ -n "$DEPLOY_COMMAND" ]; then
        echo "Running deploy command"
        eval "$DEPLOY_COMMAND"
      else
        echo "Skipping deploy. Set DEPLOY_COMMAND to enable."
      fi
  only:
    - main
