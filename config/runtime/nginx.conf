events {
    worker_connections 1024;
}

http {
    upstream ultradex_dashboard {
        server ultradex-1:3000;
        server ultradex-2:3000;
        server ultradex-3:3000;
    }

    upstream ultradex_api {
        server ultradex-1:8080;
        server ultradex-2:8080;
        server ultradex-3:8080;
    }

    # HTTP server - redirects to HTTPS
    server {
        listen 80;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;

        # SSL certificates (variable-driven)
        ssl_certificate $SSL_CERT_PATH;
        ssl_certificate_key $SSL_KEY_PATH;

        # SSL/TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # HSTS header
        add_header Strict-Transport-Security 'max-age=31536000' always;

        # Dashboard load balancing
        location / {
            proxy_pass http://ultradex_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API load balancing
        location /api/ {
            proxy_pass http://ultradex_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
