events {
    worker_connections 1024;
}

http {
    upstream ultradex_dashboard {
        server ultradex-1:3000;
        server ultradex-2:3000;
        server ultradex-3:3000;
    }

    upstream ultradex_api {
        server ultradex-1:8080;
        server ultradex-2:8080;
        server ultradex-3:8080;
    }

    server {
        listen 80;

        # Dashboard load balancing
        location / {
            proxy_pass http://ultradex_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API load balancing
        location /api/ {
            proxy_pass http://ultradex_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}