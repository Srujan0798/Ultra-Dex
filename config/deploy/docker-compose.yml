version: '3.8'

services:
  ultra-dex:
    build: .
    container_name: ultra-dex-main
    restart: unless-stopped
    ports:
      - '8866:8866' # MCP server
    volumes:
      - ./workspace:/app/workspace
      - ultra-dex-data:/app/.ultra-dex
      - /var/run/docker.sock:/var/run/docker.sock # For containerized sandboxes
    environment:
      # AI Provider Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}

      # Ultra-Dex Configuration
      - NODE_ENV=production
      - PORT=8866
      - ULTRA_DEX_THEME=dark
      - ULTRA_DEX_PROVIDER=openai
      - ULTRA_DEX_MODEL=gpt-4-turbo

      # Performance Configuration
      - MAX_WORKERS=4
      - MEMORY_LIMIT=4GB
      - TIMEOUT=300000

      # Security Configuration
      - SECURITY_AUDIT_ENABLED=true
      - RATE_LIMIT_ENABLED=true
      - LOG_LEVEL=info

    networks:
      - ultra-dex-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8866/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Database for persistent storage
  postgres:
    image: postgres:15-alpine
    container_name: ultra-dex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ultradex
      POSTGRES_USER: ultradex
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ultradex_secure_password}
    volumes:
      - ultra-dex-postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ultra-dex-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ultradex -d ultradex']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: ultra-dex-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - ultra-dex-redis:/data
    networks:
      - ultra-dex-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: ultra-dex-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ultra-dex-prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - ultra-dex-network

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana-enterprise
    container_name: ultra-dex-grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ultra-dex-grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - ultra-dex-network
    depends_on:
      - prometheus

volumes:
  ultra-dex-data:
    driver: local
  ultra-dex-postgres:
    driver: local
  ultra-dex-redis:
    driver: local
  ultra-dex-prometheus:
    driver: local
  ultra-dex-grafana:
    driver: local

networks:
  ultra-dex-network:
    driver: bridge

# Deployment instructions:
#
# 1. Create a .env file with your API keys:
#    OPENAI_API_KEY=your_openai_key
#    ANTHROPIC_API_KEY=your_anthropic_key
#    DB_PASSWORD=your_secure_db_password
#    GRAFANA_ADMIN_PASSWORD=your_grafana_password
#
# 2. Start the services:
#    docker-compose up -d
#
# 3. View logs:
#    docker-compose logs -f ultra-dex
#
# 4. Stop the services:
#    docker-compose down
#
# 5. Scale the main service:
#    docker-compose up -d --scale ultra-dex=3
#
# 6. Access the services:
#    - MCP Server: http://localhost:8866
#    - Grafana: http://localhost:3000
#    - Prometheus: http://localhost:9090
