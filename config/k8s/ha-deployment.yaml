apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultra-dex-core
  labels:
    app: ultra-dex
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ultra-dex
  template:
    metadata:
      labels:
        app: ultra-dex
    spec:
      containers:
      - name: core-api
        image: ultra-dex/core-api:latest
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: "production"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: jwt-secret
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ultra-dex-lb
spec:
  type: LoadBalancer
  selector:
    app: ultra-dex
  ports:
  - protocol: TCP
    port: 80
    targetPort: 4000
