<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap">
  <style>
    :root {
      color-scheme: light;
      --bg: #0f172a;
      --panel: #111827;
      --accent: #f97316;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    body {
      margin: 0;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 45%, #020617 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .app {
      width: min(920px, 100%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(15, 23, 42, 0.5);
      padding: 2rem;
      backdrop-filter: blur(8px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .badge {
      background: rgba(249, 115, 22, 0.2);
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.04em;
      font-size: 0.75rem;
    }

    .title {
      font-size: 2rem;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .chat {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .message {
      padding: 1rem 1.2rem;
      border-radius: 16px;
      max-width: 70%;
    }

    .message.user {
      background: #1e293b;
      align-self: flex-end;
    }

    .message.assistant {
      background: #0b1120;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    form {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    input {
      flex: 1;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #0b1120;
      color: var(--text);
      font-size: 1rem;
    }

    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.9rem 1.4rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="badge">Ultra-Dex Example</div>
        <h1 class="title">AI Chatbot</h1>
        <div class="subtitle">Ask for product, architecture, or roadmap guidance.</div>
      </div>
    </header>

    <div id="chat" class="chat"></div>

    <form id="chat-form">
      <input id="message" placeholder="Ask me about your SaaS idea..." required />
      <button type="submit">Send</button>
    </form>

    <div class="footer">Backend: Express + Ultra-Dex patterns. Customize the reply engine in <code>src/chatbot.js</code>.</div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
