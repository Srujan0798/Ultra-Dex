apiVersion: v1
kind: Secret
metadata:
  name: ultra-dex-secrets
  namespace: ultra-dex
type: Opaque
stringData:
  # Generate with: openssl rand -base64 64
  JWT_SECRET: 'REPLACE_WITH_64_CHAR_SECRET'

  # Database
  DATABASE_URL: 'postgresql://user:pass@postgres:5432/ultra-dex'
  POSTGRES_PASSWORD: 'REPLACE_WITH_DB_PASSWORD'

  # Redis
  REDIS_URL: 'redis://redis:6379'
  REDIS_PASSWORD: 'REPLACE_WITH_REDIS_PASSWORD'

  # AI Provider Keys (at least one required)
  OPENAI_API_KEY: 'REPLACE_WITH_OPENAI_KEY'
  ANTHROPIC_API_KEY: 'REPLACE_WITH_ANTHROPIC_KEY'
  GOOGLE_API_KEY: 'REPLACE_WITH_GOOGLE_KEY'
  NVIDIA_API_KEY: 'REPLACE_WITH_NVIDIA_KEY'

  # CORS (no wildcards)
  CORS_ORIGIN: 'https://app.ultra-dex.dev'

  # Monitoring
  GRAFANA_PASSWORD: 'REPLACE_WITH_GRAFANA_ADMIN_PASSWORD'
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: ultra-dex
type: kubernetes.io/tls
data:
  # Generate with: kubectl create secret tls tls-secret --cert=path/to/cert.pem --key=path/to/key.pem -n ultra-dex --dry-run=client -o yaml
  tls.crt: 'BASE64_ENCODED_CERT'
  tls.key: 'BASE64_ENCODED_KEY'
