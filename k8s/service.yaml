apiVersion: v1
kind: Service
metadata:
  name: ultra-dex-api
  namespace: ultra-dex
  labels:
    app: ultra-dex-api
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: ultra-dex-api
---
apiVersion: v1
kind: Service
metadata:
  name: ultra-dex-dashboard
  namespace: ultra-dex
  labels:
    app: ultra-dex-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: ultra-dex-dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ultra-dex-ingress
  namespace: ultra-dex
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/rate-limit: '100'
    nginx.ingress.kubernetes.io/rate-limit-window: '1m'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
spec:
  tls:
    - hosts:
        - api.ultra-dex.dev
        - app.ultra-dex.dev
      secretName: ultra-dex-tls
  rules:
    - host: api.ultra-dex.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ultra-dex-api
                port:
                  number: 4000
    - host: app.ultra-dex.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ultra-dex-dashboard
                port:
                  number: 3000
