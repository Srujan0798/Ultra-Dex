version: 2.1

orbs:
  node: circleci/node@5.2.0

jobs:
  validate:
    executor: node/default
    steps:
      - checkout
      - node/install-packages
      - run: npx ultra-dex doctor
      - run: npx ultra-dex validate

  test:
    executor: node/default
    steps:
      - checkout
      - node/install-packages
      - run: npm test
      - run: npx ultra-dex verify

  build:
    executor: node/default
    steps:
      - checkout
      - node/install-packages
      - run: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - CONTEXT.md
            - .ultra-dex

workflows:
  version: 2
  ci:
    jobs:
      - validate
      - test:
          requires:
            - validate
      - build:
          requires:
            - test
