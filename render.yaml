# Render Deployment Configuration
services:
  - type: web
    name: ultra-dex
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build:core && npm run build:cli
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BUS_TYPE
        value: memory
      - key: LOG_LEVEL
        value: info
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: BETTER_STACK_SOURCE_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
