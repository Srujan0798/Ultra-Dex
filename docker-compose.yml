services:
  ultra-dex:
    build: .
    ports:
      - '3000:3000'
      - '3002:3002'
    env_file: .env
    depends_on:
      - redis
      - postgres
    volumes:
      - '.:/app'
      - '/app/node_modules'

  redis:
    image: redis/redis-stack:latest
    ports:
      - '6379:6379'
      - '8001:8001'
    volumes:
      - 'redis-data:/data'

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ultradex
      POSTGRES_USER: ultradex
      POSTGRES_PASSWORD: ultradex_dev
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'

volumes:
  redis-data:
  postgres-data:
