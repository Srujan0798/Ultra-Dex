# Ultra-Dex Docker Compose
# Usage:
#   Development: docker compose -f docker-compose.yml --profile dev up
#   Production:  docker compose -f docker-compose.yml --profile prod up

services:
  # ==========================================================================
  # CLI Service (Production)
  # ==========================================================================
  ultra-dex:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ultra-dex:latest
    container_name: ultra-dex
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
      - "8080:8080"
    volumes:
      - ultra-dex-data:/app/.ultra-dex
      - ultra-dex-logs:/app/logs
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    profiles:
      - prod
    healthcheck:
      test: ["CMD", "node", "bin/ultra-dex.js", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # CLI Service (Development)
  # ==========================================================================
  ultra-dex-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    image: ultra-dex:dev
    container_name: ultra-dex-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
      - ultra-dex-data:/app/.ultra-dex
    environment:
      - NODE_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    command: ["node", "apps/cli/bin/ultra-dex.js", "serve"]
    profiles:
      - dev

  # ==========================================================================
  # Dashboard Service
  # ==========================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      target: production
    image: ultra-dex-dashboard:latest
    container_name: ultra-dex-dashboard
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://ultra-dex:3001
    profiles:
      - prod
      - dev
    depends_on:
      - ultra-dex

  # ==========================================================================
  # Documentation Service
  # ==========================================================================
  docs:
    build:
      context: ./apps/docs-site
      dockerfile: Dockerfile
    image: ultra-dex-docs:latest
    container_name: ultra-dex-docs
    restart: unless-stopped
    ports:
      - "3003:3000"
    profiles:
      - dev

volumes:
  ultra-dex-data:
    driver: local
  ultra-dex-logs:
    driver: local
