server_name: 'Ultra-Dex Community'
icon: '🧠'
description: 'Official community for Ultra-Dex AI orchestration'

channels:
  - name: 'rules'
    type: text
    topic: 'Community guidelines and moderation policy'
  - name: 'announcements'
    type: text
    topic: 'Official launch and release updates'
  - name: 'welcome'
    type: text
    topic: 'Onboarding and introductions'
  - name: 'general'
    type: text
    topic: 'General product and AI systems discussion'
  - name: 'help'
    type: text
    topic: 'Support and troubleshooting'
  - name: 'bugs'
    type: text
    topic: 'Bug reports and reproducible issues'
  - name: 'suggestions'
    type: text
    topic: 'Feature requests and roadmap input'
  - name: 'development'
    type: text
    topic: 'Contributors and implementation discussion'
  - name: 'showcase'
    type: text
    topic: 'Share projects built with Ultra-Dex'
  - name: 'enterprise'
    type: text
    topic: 'Enterprise adoption and compliance topics'
  - name: 'jobs'
    type: text
    topic: 'Hiring and collaboration posts'
  - name: 'office-hours'
    type: voice
    bitrate: 128000

roles:
  - name: 'Founder'
    color: '#FFD700'
    permissions:
      - administrator
  - name: 'Core Team'
    color: '#FF6B6B'
    permissions:
      - manage_messages
      - moderate_members
  - name: 'Contributors'
    color: '#4ECDC4'
  - name: 'Members'
    color: '#F7FFF7'

bots:
  - name: 'Carl-bot'
    purpose: 'Roles + onboarding'
  - name: 'MEE6'
    purpose: 'Levels + engagement'
  - name: 'GitHub'
    purpose: 'PR/release notifications'
